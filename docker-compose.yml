services:
  postgres:
    image: postgres:16-alpine
    container_name: idata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idata
      POSTGRES_USER: idata
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idata"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: idata-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: idata-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://idata:${DB_PASSWORD}@postgres:5432/idata
      ML_SERVICE_URL: http://ml:8000
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node prisma-dist/seed.js && node dist/main.js"

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    container_name: idata-ml
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://idata:${DB_PASSWORD}@postgres:5432/idata
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: idata-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
